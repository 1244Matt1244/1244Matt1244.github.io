name: Daily Rebuild
on:
  schedule:
    - cron: '0 3 * * *'  # svaki dan u 3:00 UTC
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger GitHub Pages build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/1244Matt1244/1244Matt1244.github.io/pages/builds
